<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sää</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="navbar navbar-expand-sm navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">JSON-tehtävät</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#valikko">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="valikko">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="index.html">Etusivu</a></li>
          <li class="nav-item"><a class="nav-link" href="toteutus.html">Toteutus</a></li>
          <li class="nav-item"><a class="nav-link" href="poke.html">Poke</a></li>
          <li class="nav-item"><a class="nav-link" href="saa.html">Sää</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-4">
    <h1>Helsingin sää</h1>
    <p id="aika"></p>
    <div id="saa">Haetaan säätietoja...</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const aika = new Date();
    document.getElementById("aika").innerHTML =
      "Sivu ladattu: " + aika.toLocaleDateString("fi-FI") + " klo " + aika.toLocaleTimeString("fi-FI");

    fetch("https://api.openweathermap.org/data/2.5/weather?id=658225&appid=665ecd56dfc08dbb50feb8b8f5034e28&lang=fi&units=metric")

      .then(function (response) {
        return response.json();
      })

      .then(function (data) {
        saa(data);
      })

      // Virhetilanne
      .catch(function (error) {
        document.getElementById("saa").innerHTML = "<p>Säätietoa ei pystytä hakemaan</p>";
      });

    function saa(data) {
    
      let kuva = "https://openweathermap.org/img/wn/" + data.weather[0].icon + "@2x.png";

      let tiedot = "<h3>Sää</h3>" + data.weather[0].description + "<br>"
        + "<h3>Lämpötila</h3>" + data.main.temp + " °C<br>"
        + "<h3>Tuuli</h3>" + data.wind.speed + " m/s<br>"
        + "<p><img src='" + kuva + "' alt='" + data.weather[0].description + "'></p>";

      document.getElementById("saa").innerHTML = tiedot;
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Toteutus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="navbar navbar-expand-sm navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">JSON-tehtävät</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#valikko">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="valikko">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="index.html">Etusivu</a></li>
          <li class="nav-item"><a class="nav-link" href="toteutus.html">Toteutus</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-4" id="vastaus"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    fetch("toteutus.json")
      .then(function (response) {
        return response.json();
      })
      .then(function (responseJson) {
        kerro(responseJson);
      })
      .catch(function (error) {
        document.getElementById("vastaus").innerHTML = "<p>Tietoa ei pystytä hakemaan</p>";
      });

    function kerro(obj) {
      let tiedot = "<h1>" + obj.nimi + "</h1><hr>";

      tiedot += "<p><img src='" + obj.kuva + "'></p>";

      tiedot += "<p>"
        + "<b>Osallistujien lukumäärä:</b> " + obj.osallistujienLukumaara + " kpl<br>"
        + "<b>Alkamisaika:</b> " + obj.alkamisaika + "<br>"
        + "<b>Loppumisaika:</b> " + obj.loppumisaika + "<br>"
        + "<b>Kesto:</b> " + obj.kestoViikkoina + " viikkoa"
        + "</p>";

    
      tiedot += "<h3>Osallistujat</h3><ul>";
      for (var i = 0; i < obj.osallistujat.length; i++) {
        tiedot += "<li>" + obj.osallistujat[i] + "</li>";
      }
      tiedot += "</ul>";

      document.getElementById("vastaus").innerHTML = tiedot;
    }
  </script>
</body>
</html>

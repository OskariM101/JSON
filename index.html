<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JSON-datan käsittelyä</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="navbar navbar-expand-sm navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">JSON-tehtävät</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#valikko">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="valikko">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="index.html">Etusivu</a></li>
          <li class="nav-item"><a class="nav-link" href="toteutus.html">Toteutus</a></li>
          <li class="nav-item"><a class="nav-link" href="poke.html">Poke</a></li>
          <li class="nav-item"><a class="nav-link" href="saa.html">Sää</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-4" id="vastaus"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Haetaan JSON-tietue
    fetch("tietue.json")

      // Muutetaan vastaus
      .then(function (response) {
        return response.json();
      })

       // Käsitellään ja välitetään tieto
      .then(function (responseJson) {
        kerro(responseJson);
      })

      // virhe ilmoitus
      .catch(function (error) {
        document.getElementById("vastaus").innerHTML = "<p>Tietoa ei pystytä hakemaan</p>";
      });

    function kerro(obj) {
      // Otsikko ja kuvaus
      let tiedot = "<h1>" + obj.otsikko + "</h1><br>" + obj.kuvaus + "<br><hr>";

      // Kuva
      tiedot += "<p><img src='" + obj.kuva + "'></p>";

      // Opintojakso
      tiedot += "<h3>Opintojakso</h3>"
        + "Nimi: " + obj.opintojakso.nimi + "<br>"
        + "Tunnus: " + obj.opintojakso.tunnus + "<br>"
        + "Opintopisteet: " + obj.opintojakso.opintopisteet + "<br>";

      // Käytetään for-silmukkaa
      tiedot += "<p><h3>Aiheet</h3>";

      for (var i = 0; i < obj.tekniikat.length; i++) {
        tiedot += "<b>Aihe: " + obj.tekniikat[i].aihe + "</b>";
        tiedot += " <a href='" + obj.tekniikat[i].linkki + "'>" + obj.tekniikat[i].linkki + "</a><br>";
      }

      tiedot += "</p>";
      document.getElementById("vastaus").innerHTML = tiedot;
    }
  </script>
</body>
</html>

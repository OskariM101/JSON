<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pokemon haku</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="navbar navbar-expand-sm navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">JSON-tehtävät</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#valikko">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="valikko">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="index.html">Etusivu</a></li>
          <li class="nav-item"><a class="nav-link" href="toteutus.html">Toteutus</a></li>
          <li class="nav-item"><a class="nav-link" href="poke.html">Poke</a></li>
          <li class="nav-item"><a class="nav-link" href="saa.html">Sää</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-4">
    <h1>Pokemon haku</h1>

    <div class="mb-3">
      <input type="text" id="pokemonName" placeholder="Enter Pokemon name">
      <button class="btn btn-success btn-sm" onclick="poke()">Hae</button>
    </div>

    <div id="nimi">Kirjoita laatikkoon Pokemonin nimi</div>
    <p id="kuva2"></p>

    <!--Käännä-painike-->
    <div id="kaanna"></div>

    <!--Lisätiedot-->
    <div id="lisatiedot" class="mt-3"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
  
    let name = "";      // Pokemonin nimi
    let pokeData = null;      // Haun tiedot
    function tyhjenna() {      // Tyhjentää haun
      pokeData = null;
      document.getElementById("nimi").innerHTML = "";
      document.getElementById("kuva2").innerHTML = "";
      document.getElementById("kaanna").innerHTML = "";
      document.getElementById("lisatiedot").innerHTML = "";
    }
    // Haku kutsu
    function poke() {
      const pokeName = document.getElementById("pokemonName").value.trim().toLowerCase();
      name = document.getElementById("pokemonName").value.trim();

      tyhjenna();

      // Virhetilanne
      if (pokeName === "") {
        document.getElementById("nimi").innerHTML = "<p>Kirjoita ensin Pokemonin nimi</p>";
        return;
      }

      fetch(`https://pokeapi.co/api/v2/pokemon/${pokeName}`)

        // Muutetaan vastaus JSON-muotoon
        
        .then(function (response) {
          return response.json();
        })
        .then(function (responseJson) {
          pokekuva(responseJson);
        })

        // Virhetilanne
        .catch(function (error) {
          document.getElementById("nimi").innerHTML = "<p>Pokemonia ei löytynyt tai tietoa ei pystytä hakemaan</p>";
          document.getElementById("pokemonName").value = "";
        });
    }
    // Näyttää Pokemonin etukuvan ja Käännä-painikkeen
    function pokekuva(obj) {
      pokeData = obj;

      // Linkki Pokemonin kuvaan
      let pokeurl = obj.sprites.front_default;

      // Virhetilanne
      if (pokeurl === null) {
        document.getElementById("nimi").innerHTML = "<p>Pokemonille ei löytynyt kuvaa</p>";
        document.getElementById("pokemonName").value = "";
        return;
      }

      document.getElementById("kuva2").innerHTML = "<img src='" + pokeurl + "' alt='" + name + "'>";
      document.getElementById("nimi").innerHTML = "<b>" + name + "</b>";
      // Käännä-painike näkyviin
      document.getElementById("kaanna").innerHTML =
        "<button class='btn btn-success' onclick='kaanna()'>Käännä</button>";
      // Tyhjenetään hakukenttä
      document.getElementById("pokemonName").value = "";
    }
    // Haetaan kun painetaan Käännä-painiketta
    function kaanna() {
      // Selkäkuva
      let selkaurl = pokeData.sprites.back_default;

      // Virhetilanne
      if (selkaurl !== null) {
        document.getElementById("kuva2").innerHTML = "<img src='" + selkaurl + "' alt='" + name + " selin'>";
      }
      // For-silmukka
      let tyypit = [];
      for (var i = 0; i < pokeData.types.length; i++) {
        tyypit.push(pokeData.types[i].type.name);
      }
      // Pituus on desimetreinä ja paino hehtogrammoina, joten jaetaan kympillä
      let tiedot = "<h3>Lisätiedot</h3>"
        + "<b>Pituus:</b> " + pokeData.height / 10 + " m<br>"
        + "<b>Paino:</b> " + pokeData.weight / 10 + " kg<br>"
        + "<b>Tyypit:</b> " + tyypit.join(", ");

      if (selkaurl === null) {
        tiedot += "<br><i>Tällä Pokemonilla ei ole selkäkuvaa.</i>";
      }

      document.getElementById("lisatiedot").innerHTML = tiedot;
    }
  </script>
</body>
</html>
